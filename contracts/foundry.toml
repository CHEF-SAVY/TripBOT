[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

# Bounded well below the defaults (256 x 500), which took nine minutes on this suite and
# would dominate CI. The handler rejects malformed input rather than reverting, so these
# sequences still reach settlement, slashing, and withdrawal rather than bouncing off guards.
[invariant]
runs = 64
depth = 96
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# BOT Chain testnet ("Bohr") — chain ID 968. Mainnet (chain ID 677, rpc.botchain.ai) is
# deliberately not configured here: this project is testnet-only until the hackathon
# submission is deployed and verified on bot_testnet.
[profile.bot_testnet]
chain_id = 968

[rpc_endpoints]
bot_testnet = "https://rpc.bohr.life"
