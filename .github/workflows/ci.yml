name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        # ArcForkIntegration forks live Arc testnet (see its own doc comment) — a pre-deploy
        # smoke test, not a unit-test replacement, so CI shouldn't depend on live network
        # access (and its latency) on every push. Run it manually before Phase 4 deploys via
        # `forge test --match-contract ArcForkIntegration`.
        run: forge test -vvv --no-match-contract ArcForkIntegration

  app:
    name: App (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc-nanopayments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arc-nanopayments/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
